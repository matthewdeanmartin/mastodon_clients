---
name: Refresh machine metadata
# Collect machine observations and open a pull request with the result.
#
# Deliberately manual. Spec section 15 says collection is an explicitly invoked
# job and is not initially scheduled, and section 25 says the result must arrive
# as a reviewable change rather than silently altering the live site from
# transient network results.
#
# So this workflow never pushes to main and never deploys. It opens a pull
# request against data/generated/observations.json, and a human decides.
on:
  workflow_dispatch:
    inputs:
      client:
        description: Limit collection to one client slug (blank collects all)
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: refresh-metadata
  cancel-in-progress: false
jobs:
  refresh:
    name: Collect observations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --extra collect
      # This is the one step in the repository that reaches the public internet.
      # An unauthenticated GitHub API is rate-limited; the token raises the
      # limit, and a failed request is recorded as a failed observation rather
      # than crashing the run.
      - name: Collect observations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_INPUT: ${{ inputs.client }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$CLIENT_INPUT" ]; then
            args+=(--client "$CLIENT_INPUT")
          fi
          uv run python -m mastodon_clients.cli refresh-metadata "${args[@]}" \
            | tee refresh-report.txt
      - name: Verify the site still builds with the new observations
        # A refresh that produces data the build cannot consume should fail here,
        # not in the deploy after someone merges it.
        run: make build
      - name: Open a pull request with the changed observations
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          add-paths: data/generated/observations.json
          branch: refresh-metadata
          delete-branch: true
          commit-message: 'data: refresh machine observations'
          title: 'Refresh machine observations'
          body-path: refresh-report.txt
          labels: data
