---
name: Deploy to GitHub Pages
# Build the site and hand it to GitHub Pages as an artifact.
#
# This repository's Pages source is "GitHub Actions", so Pages waits for a
# workflow to upload an artifact and call deploy-pages. It does not watch any
# branch. An earlier version of this workflow pushed a gh-pages branch instead,
# which reported success while publishing nothing, because nothing was watching
# that branch. If the site ever stops updating, check that
# Settings > Pages > Source still reads "GitHub Actions" before looking anywhere
# else.
#
# One production site: no canary and no test deployment. The sibling project
# this was modelled on serves prod and canary from a single Pages site, which
# needs a subtree layout only a branch push can express. A single site does not,
# so the artifact route is both simpler and what this repository is already
# configured for.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish (branch, tag, or commit SHA)
        required: false
        default: main
        type: string
permissions:
  contents: read
# Let an in-progress deploy finish rather than cancelling it: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # Reports the site's own base URL, so the build uses the real base path
      # rather than a value hard-coded here that could drift from the repository
      # name. Every canonical link, OpenGraph URL, and sitemap entry derives from
      # it, so getting it from Pages itself removes a whole class of mismatch.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Sync dependencies
        run: uv sync --locked
      # Validation gates the deploy as well as the pull request. A data error
      # must never reach the published site, even if it somehow reached main.
      - name: Validate data
        run: make validate
      - name: Build production site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: make build-prod SITE_URL="$SITE_URL"
      - name: Verify the build before publishing
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -f output/index.html
          test -f output/clients/index.html
          test -f output/sitemap.xml
          # No CNAME: this is a project Pages site, not a custom domain.
          test ! -e output/CNAME
          # Canonical tags and sitemap entries must be absolute, or they point at
          # the wrong host.
          grep --fixed-strings "rel=\"canonical\" href=\"$SITE_URL/\"" output/index.html
          grep --fixed-strings "<loc>$SITE_URL/clients/</loc>" output/sitemap.xml
          # Internal links must carry the project sub-path. Without it a browser
          # resolves them against the origin root and every one 404s -- the bug
          # that shipped a thousand broken links on a build reporting success.
          # `make build-prod` already fails on this via check_local_links; this is
          # a second, independent look at the artifact about to be published.
          if grep -rhoE 'href="/[^"]*"' output/ | grep -v '^href="/mastodon_clients' | grep -q .; then
            echo "::error::Internal links are missing the /mastodon_clients prefix:"
            grep -rhoE 'href="/[^"]*"' output/ | grep -v '^href="/mastodon_clients' | sort -u | head -20
            exit 1
          fi
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pages: write` and `id-token: write` are what deploy-pages requires. The
    # environment block is what puts the deployed URL on the run summary, which
    # is the quickest way to tell a real deploy from a no-op.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
