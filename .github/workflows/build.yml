---
name: CI
# Validate and build every pull request and every push to main.
#
# The build is entirely offline with respect to the sites being reviewed: it
# reads committed data only, never the live internet. A network call during this
# job is a bug, not a flake. Machine observations enter the repository through
# refresh-metadata.yml, which a human dispatches and reviews.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Test
        run: make test
      # Validation is a gate in its own right, not just a build step: a data
      # error should fail with the validator's own report rather than as a
      # confusing template error further down.
      - name: Validate data
        run: make validate
      - name: Build site
        run: make build
      - name: Check the build produced the expected pages
        # A build that "succeeds" while emitting nothing is the failure mode a
        # green CI run would otherwise hide. `make build` also fails if any page
        # references a stylesheet or script that was not written -- a renamed
        # asset otherwise ships as a silently unstyled site.
        run: |
          test -f output/index.html
          test -f output/clients/index.html
          test -f output/about/index.html
          test -f output/methodology/index.html
          test -f output/methodology/scoring/index.html
          test -f output/sitemap.xml
          test -f output/robots.txt
          test -f output/clients.json
          for audience in new-users power-users twitter-refugees news-junkies content-creators; do
            test -f "output/for/$audience/index.html"
          done
      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0  # v7.0.1
        with:
          name: site
          path: output/
          retention-days: 7
