[project]
name = "mawkingbird"
version = "0.1.0"
description = "Static directory and review site for Mastodon-compatible web clients"
readme = "README.md"
authors = [{ name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
keywords = ["mastodon", "fediverse", "pelican", "directory", "reviews"]
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "pelican>=4.9.1",
    "markdown>=3.6",
]

[project.optional-dependencies]
# Network collectors for `make refresh-metadata`. Deliberately optional: the
# ordinary site build must never import them, so a missing httpx cannot make a
# build fail (spec/spec.md invariant 1).
collect = [
    "httpx>=0.27.0",
]

[project.scripts]
mawkingbird = "mawkingbird.cli:main"

[project.urls]
Repository = "https://github.com/matthewdeanmartin/mastodon_clients"
homepage = "https://mawkingbird.com/"
issues = "https://github.com/matthewdeanmartin/mastodon_clients/issues/"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mawkingbird"]

[dependency-groups]
# Minimal by design: ruff, mypy, pytest. Versions match ../mastodon_mock so the
# two repositories lint identically in GitHub Actions.
dev = [
    "ruff>=0.16.4",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mawkingbird", "tests"]

# Fixtures are passed into tests as bare parameters; annotating every one adds
# noise without catching anything, so the test package relaxes those two checks
# only. Everything else stays strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

# The Anthropic SDK is an optional editorial-time dependency, imported lazily
# inside the generator and never on the build path.
[[tool.mypy.overrides]]
module = "anthropic"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
# Preview rules are opt-in below by exact code, so a Ruff upgrade cannot silently
# expand a selected rule family with unstable checks.
preview = true

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    "B",   # bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",   # line too long
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
