schema_version = 1

slug = "nicolium"
name = "Nicolium"
summary = "A feature-rich fediverse web client with a WYSIWYG composer, emoji reactions, chats, and per-post interaction policies. Built for Mastodon-compatible servers, with particular attention to Pleroma, Akkoma, Iceshrimp, and GoToSocial."

status = "active"
reviewed_at = 2026-08-29

# A fork of Soapbox, which it says so itself. Recorded as one so the directory
# shows the Soapbox lineage as a family rather than as unrelated peers.
fork_of = "soapbox"
fork_note = "Adds a WYSIWYG composer, emoji reactions, chats, groups, and interaction policies, and targets Pleroma, Akkoma, Iceshrimp.NET, and GoToSocial alongside Mastodon."

source_model = "open-source"
license = "AGPL-3.0-or-later"

deployment = "hosted-and-self-hostable"
server_dependency = "independent"
funding_model = ["volunteer"]

audiences = [
    "power-users",
    "content-creators",
]

[[links]]
type = "homepage"
url = "https://nicolium.app/"

[[links]]
type = "hosted"
url = "https://web.nicolium.app/"
label = "Public deployment"

[[links]]
type = "source"
url = "https://git.pleroma.social/nicolium/nicolium"

[[links]]
type = "issues"
url = "https://git.pleroma.social/nicolium/nicolium/issues"

# Feature values were established by reading the source (cloned from
# git.pleroma.social, commit of 2026-08-29), not from the project's marketing
# copy and not by assuming the parent's values carry over. Named evidence:
#
#   multi_account          packages/nicolium/src/components/auth/external-login-form.tsx
#   push_notifications     packages/nicolium/src/actions/push-notifications.ts
#   column_layout          packages/nicolium/src/columns/ (bookmarks, notifications, ...)
#   hashtag_following      packages/nicolium/src/columns/timeline.tsx
#   account_notes          packages/nicolium/src/components/accounts/account-menu.tsx
#   notification_filtering packages/nicolium/src/queries/notifications/use-notifications.ts
#   reduced_motion         packages/nicolium/src/components/animated-number.tsx
#   translation            packages/nicolium/src/components/statuses/action-bar/buttons/
#   pwa                    packages/nicolium/src/service-worker/sw.ts + manifest.json
#   accessibility          332 aria- attributes across the component tree
#
# `saved_searches` is recorded as absent: nothing in the source implements it.
[features]
multi_account = true
lists = true
filters = true
push_notifications = true
quote_posts = true
scheduled_posts = true
bookmarks = true
translation = true
local_timeline = true
federated_timeline = true
custom_emoji = true
content_warnings = true
moderation_controls = true
column_layout = true
keyboard_navigation = true
advanced_search = true
saved_searches = false
hashtag_following = true
thread_view = true
media_galleries = true
drafts = true
polls = true
post_editing = true
account_notes = true
follow_requests = true
profile_editing = true
server_switching = true
notification_filtering = true
accessibility_features = true
reduced_motion = true
responsive_layout = true
pwa = true
