schema_version = 1

slug = "semaphore"
name = "Semaphore"
summary = "A fork of Pinafore by Nick Colley that continued its accessibility-first approach after the original was retired. Its source repository is now archived."

# The repository is archived, which is a strong signal but not an announcement
# of discontinuation. Recorded as inactive rather than discontinued: no
# statement from the maintainer has been found, and invariant 5 forbids
# reaching "discontinued" from a repository flag alone.
status = "inactive"
reviewed_at = 2026-08-29

# Part of the Pinafore family: Nick Colley picked the project up after Nolan
# Lawson retired it. Recorded as a fork so the directory shows one row for the
# lineage rather than three near-identical entries.
fork_of = "pinafore"
fork_note = "Continued Pinafore after its retirement, keeping the accessibility-first approach. Its repository is now archived."

source_model = "open-source"
license = "AGPL-3.0-only"

deployment = "hosted-and-self-hostable"
server_dependency = "independent"
funding_model = ["volunteer"]

audiences = [
    "new-users",
    "power-users",
]

[links]
homepage = "https://semaphore-social.vercel.app/"
hosted = "https://semaphore-social.vercel.app/"
source = "https://github.com/NickColley/semaphore"
issues = "https://github.com/NickColley/semaphore/issues"

