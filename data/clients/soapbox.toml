schema_version = 1

slug = "soapbox"
name = "Soapbox"
summary = "An alternative fediverse frontend, deployed by server operators in place of the stock interface rather than used as a standalone client against an arbitrary instance."

status = "active"
reviewed_at = 2026-08-29

source_model = "open-source"
license = "AGPL-3.0-only"

# Deployed by an operator alongside a server, which is a materially different
# proposition from a client a reader can simply open.
deployment = "self-hostable"
server_dependency = "requires-server-deployment"
funding_model = ["donations", "volunteer"]

audiences = [
    "power-users",
]

[[links]]
type = "homepage"
url = "https://soapbox.pub/"

# The frontend's own deployment, which works against a Mastodon-compatible
# server. Deliberately NOT ditto.pub: that is the same team's separate
# Nostr-first product, and sending a reader there for a Mastodon client would
# send them to unrelated software.
[[links]]
type = "hosted"
url = "https://fe.soapbox.pub/"
label = "Soapbox frontend deployment"

[[links]]
type = "source"
url = "https://gitlab.com/soapbox-pub/soapbox"
label = "Primary repository (GitLab)"

[[links]]
type = "source"
url = "https://github.com/soapbox-pub/soapbox"
label = "GitHub mirror"

[[links]]
type = "issues"
url = "https://gitlab.com/soapbox-pub/soapbox/-/issues"

# Feature values were established by reading the source (cloned from
# gitlab.com/soapbox-pub/soapbox), not inferred from the project's description.
# Named evidence for the values that were previously unknown:
#
#   multi_account          src/actions/auth.ts
#   push_notifications     src/actions/push-notifications/registerer.ts
#   translation            src/actions/statuses.ts
#   keyboard_navigation    src/components/pure-status.tsx
#   advanced_search        src/actions/compose.ts
#   hashtag_following      src/actions/tags.ts
#   account_notes          src/features/ui/components/panels/account-note-panel.tsx
#   notification_filtering src/actions/notifications.ts
#   drafts                 src/actions/compose-status.ts
#   post_editing           src/actions/statuses.ts
#   reduced_motion         src/actions/settings.ts (a real user setting)
#   pwa                    src/service-worker/
#
# `saved_searches` is partial: recent searches exist, but only inside the groups
# feature rather than as a general saved-search facility.
[features]
multi_account = true
lists = true
filters = true
push_notifications = true
quote_posts = true
scheduled_posts = true
bookmarks = true
translation = true
local_timeline = true
federated_timeline = true
custom_emoji = true
content_warnings = true
moderation_controls = true
column_layout = true
keyboard_navigation = true
advanced_search = true
saved_searches = "partial"
hashtag_following = true
thread_view = true
media_galleries = true
drafts = true
polls = true
post_editing = true
account_notes = true
follow_requests = true
profile_editing = true
server_switching = false
notification_filtering = true
accessibility_features = true
reduced_motion = true
responsive_layout = true
pwa = true
