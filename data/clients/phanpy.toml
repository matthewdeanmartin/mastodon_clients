status = "active"
reviewed_at = 2026-08-29

source_model = "open-source"
license = "MIT"

deployment = "hosted-and-self-hostable"
server_dependency = "independent"
funding_model = ["donations"]

audiences = [
    "power-users",
    "news-junkies",
]

[links]
homepage = "https://phanpy.social/"
