schema_version = 1

slug = "mawkingbird"
name = "Mawkingbird"
summary = "A familiar, Twitter-inspired Mastodon client with Bluesky and RSS integration, starter kits to build your feed, and anonymous browsing before you join. Free to use, with optional Plus features."

status = "active"
reviewed_at = 2026-09-05

# Open core: the client is published under the MIT licence as part of the
# mastodon_mock repository, while the server-side components behind the paid
# tier are not. Source availability and licence are recorded separately, so
# "hybrid" describes the split rather than blurring it (spec 11).
source_model = "hybrid"
license = "MIT"

deployment = "hosted-and-self-hostable"
server_dependency = "independent"
funding_model = ["freemium"]

audiences = [
    "new-users",
    "power-users",
    "twitter-refugees",
    "content-creators",
]

[[links]]
type = "hosted"
url = "https://mawkingbird.com/"
label = "Hosted application"

[[links]]
type = "source"
url = "https://github.com/matthewdeanmartin/mastodon_mock"
label = "Source (client lives in ui/, built as the mockingbird configuration)"

[[links]]
type = "issues"
url = "https://github.com/matthewdeanmartin/mastodon_mock/issues"

[[links]]
type = "documentation"
url = "https://mastodon-mock.readthedocs.io/en/latest/"

# Feature values are based on the client source; unresolved capabilities stay unknown.
[features]
multi_account = true
lists = true
filters = true
push_notifications = false
quote_posts = true
scheduled_posts = true
bookmarks = true
translation = true
local_timeline = true
federated_timeline = true
custom_emoji = true
content_warnings = true
moderation_controls = true
column_layout = false
keyboard_navigation = true
advanced_search = true
saved_searches = "unknown"
hashtag_following = true
thread_view = true
media_galleries = true
drafts = true
polls = true
post_editing = true
account_notes = "unknown"
follow_requests = true
profile_editing = true
server_switching = true
notification_filtering = "unknown"
accessibility_features = true
reduced_motion = "unknown"
responsive_layout = true
# A web app manifest is published, but no service worker was found in the
# source, so the offline-tolerant half of installability is not established.
pwa = "partial"
