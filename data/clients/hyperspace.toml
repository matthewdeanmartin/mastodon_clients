schema_version = 1

slug = "hyperspace"
name = "Hyperspace"
summary = "A Mastodon client built in React and TypeScript with a Material-styled interface, offered both as a hosted web application and as desktop builds. Its repository is archived."

status = "discontinued"
reviewed_at = 2026-08-29
discontinued_at = 2022-06-17
discontinued_evidence = "The source repository at github.com/hyperspacedev/hyperspace has been archived by its owner, and no commits have been recorded since June 2022. Archiving is an explicit act by the maintainer rather than an inference from inactivity."
successors = ["elk", "phanpy"]

source_model = "open-source"
