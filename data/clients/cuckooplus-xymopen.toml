schema_version = 1

slug = "cuckooplus-xymopen"
name = "Cuckoo+ (xymopen fork)"
summary = "A maintained fork of Cuckoo+, keeping the original's Google+-style card layout. This is the branch of the project with a working public deployment."

status = "active"
reviewed_at = 2026-08-29

# The original stopped receiving commits in 2022 and its deployment is gone;
# this fork is where the working software lives. Recorded as a fork so the
# directory shows one Cuckoo+ row that reflects the living branch rather than
# listing a dead parent beside its live descendant.
fork_of = "cuckoo-plus"
fork_note = "The branch with a working public deployment. Updated June 2025, where the original's last commit was October 2022."

source_model = "open-source"
license = "MIT"

deployment = "hosted-and-self-hostable"
server_dependency = "independent"
funding_model = ["volunteer"]

audiences = [
    "twitter-refugees",
]

[[links]]
type = "hosted"
url = "https://cuckooplus.pages.dev/"
label = "Public deployment"

[[links]]
type = "source"
url = "https://github.com/xymopen/CuckooPlus"

[[links]]
type = "issues"
url = "https://github.com/xymopen/CuckooPlus/issues"

