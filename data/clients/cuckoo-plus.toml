schema_version = 1

slug = "cuckoo-plus"
name = "Cuckoo+"
summary = "A Mastodon web client whose interface deliberately resembled Google+, with a card-based multi-column reading layout. No commits have been recorded since 2022."

# Long inactive and its hosted instance reportedly unreachable, but no
# announcement of discontinuation has been found. Recorded as inactive:
# invariant 5 forbids reaching "discontinued" without evidence.
status = "inactive"
reviewed_at = 2026-08-29

source_model = "open-source"
license = "MIT"

deployment = "hosted-and-self-hostable"
server_dependency = "independent"
funding_model = ["volunteer"]

audiences = [
    "twitter-refugees",
]

# No hosted link: the original's public deployment is gone. The working
# deployment belongs to the fork, and claiming it here would credit this record
# with something it does not provide.
[links]
homepage = "https://github.com/NanaMorse/Cuckoo.Plus"
source = "https://github.com/NanaMorse/Cuckoo.Plus"
issues = "https://github.com/NanaMorse/Cuckoo.Plus/issues"

