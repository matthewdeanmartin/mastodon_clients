# Feature taxonomy (spec/spec.md section 10).
#
# `core = true`  -- counts toward the feature-breadth score. Omitting a core
#                   feature lowers a client's rating; omitting a non-core one
#                   does not.
# `page = true`  -- gets a /features/<id>/ landing page. Only features with real
#                   navigational value do, so the site does not mass-produce
#                   near-duplicate pages (spec 39).
#
# Adding a feature here does not invalidate existing client records: an
# unrecorded feature reads as "unknown".

# --- Core Mastodon capabilities -------------------------------------------

[[feature]]
id = "multi_account"
label = "Multi-account"
description = "Sign in to more than one account, on one or several servers, and switch between them without logging out."
core = true
page = true

