# Human editorial copy; retained across generated review refreshes.
[prose]
summary = """
Mawkingbird brings the familiar feel of Twitter’s 2018 design to Mastodon, with Bluesky and RSS integration that broadens what you can read in one place. Start with a feed you enjoy, then explore more features at your own pace.

Browse anonymously before you create an account, or sign in and join the conversation. Mawkingbird is created by Matthew Martin, the author of this guide.
"""
who_is_it_for = """
New to Mastodon? Starter kits help you find people and topics on day one. You can explore public content before deciding to create an account.

If you miss old Twitter, the familiar design gives you a place to settle in. If your interests span Mastodon, Bluesky and RSS, Mawkingbird brings those reading experiences into the same client.

For power users, lists, filters and composition tools are there when you want them. You can leave those features alone until you need them.
"""
notable_features = """
- **A familiar starting point:** a design inspired by Twitter in 2018.
- **More of what you follow:** Mastodon, Bluesky and RSS integration.
- **A feed from day one:** starter kits help you discover people and sources.
- **Explore before joining:** anonymous browsing lets you get to know the experience before signing in. Posting and replying require an account.
- **Room to grow:** drafts, scheduled posts, translation, lists and filters support deeper use as your needs change.

If side-by-side timeline columns are essential, compare clients with a column layout. Mawkingbird uses a different approach to reading; it also does not currently offer web push notifications.
"""
deployment = """
[Open Mawkingbird](https://mawkingbird.com/) and choose to browse anonymously or sign in. The live preview lets you see the experience before choosing.

The browser client can also be self-hosted from its public source. Plus server-side services are separate.
"""
source_and_licensing = """
The browser client is published under the MIT licence. The paid server-side components are separate, so the product uses an open-core model.
"""
funding = """
**Free to use, with optional Plus.** The anonymous and free signed-in experiences are ongoing ways to use Mawkingbird, not a 30-day trial.

Free users can keep their feeds and settings in the browser and move them by file. Plus adds the convenience of syncing across devices and reading more full articles without leaving the app. Opening article links in a new tab remains free.

[See the current Free and Plus details](https://mawkingbird.com/plans).
"""
maintenance = """
Mawkingbird is maintained by Matthew Martin. The project signals below show the latest recorded checks. Repository activity includes the Mastodon mock server as well as the client.
"""
verdict = """
Try Mawkingbird if you want a familiar interface, help finding your first feed, or a reading experience that reaches across Mastodon, Bluesky and RSS. You can begin anonymously and discover the deeper tools when you’re ready.
"""
