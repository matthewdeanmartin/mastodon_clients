# Human prose override (spec/spec.md section 20).
#
# Sections here replace the generated prose of the same name at build time, and
# survive every future regeneration -- nothing in `make generate-review` writes
# to this file tree.
#
# This entry is written by hand because it is the directory author's own client,
# and having a model draft promotional copy for it would be worse than writing
# it plainly and signing it. The relationship is stated once, in the summary,
# and in the site-wide footer. It does not need restating in every section.

[prose]

summary = """
Mawkingbird is a Mastodon web client built around a command bar and keyboard
navigation, with a set of reading tools -- translation, bookmarks, and analytics
over your own timeline -- that most clients in this directory do not offer.

It is free to use against any Mastodon-compatible server. Some server-side
features are paid.

It is maintained by Matthew Martin, who also writes this directory.
[More on that](/about/).
"""

who_is_it_for = """
The command bar and keyboard shortcuts suit people who would rather type than
click, and who already know what they want to do. Readers who prefer to browse
by pointing will find that machinery gets out of the way rather than helping.

The reading tools -- translation, bookmarks, timeline analytics -- are aimed at
people who follow accounts across languages or read enough to want a record of
what they read.

If you want several timelines side by side, this is the wrong client: there is
no column or deck layout, and clients that offer one are listed in this
directory.
"""

notable_features = """
The command bar is the main organising idea: most actions are reachable by
typing rather than navigating to them.

Beyond the usual core set, the client supports quote posts and scheduled posts,
both of which several clients here do not. Translation is built in, as are
drafts, post editing, and polls.

Timeline analytics are unusual for a Mastodon client -- summaries of your own
reading and posting rather than of an audience.

Two gaps worth naming: there is no column layout, and no web push notifications,
so nothing arrives while the client is closed.
"""

deployment = """
Usable at mawkingbird.com against any Mastodon-compatible server -- no server
deployment of your own, and no account beyond the one you already have.

The client is also self-hostable: it builds from the public source as a static
site. Self-hosting gives you the client without the paid server-side features,
which are not part of the open source.
"""

source_and_licensing = """
Open core. The client is published under the MIT licence as part of the
mastodon_mock repository, where it builds from `ui/` as the `mockingbird`
configuration. You can read it, fork it, and run your own.

The server-side components behind the paid tier are not open source. This
directory records the client as hybrid for that reason rather than calling the
whole product open source, since the distinction is exactly the sort of thing a
reader deserves to have stated plainly.
"""

funding = """
Freemium: the client is free to use, and some server-side features are paid.

For a reader, that is worth knowing in the same way it is worth knowing that a
donation-funded client depends on its maintainer's willingness to keep paying
for hosting. A commercial tier is a different sustainability model, not
automatically a better or worse one.
"""

maintenance = """
The signals here are collected by the same job, on the same schedule, as every
other entry: commit and release dates, repository state, and whether the hosted
application and documentation respond.

One caveat the numbers do not carry on their own. Those signals come from the
mastodon_mock repository, which holds the mock Mastodon server as well as this
client. A commit there is not necessarily a commit to the client, so the
activity reading is more generous to Mawkingbird than a client with its own
repository would get from the same evidence.

That is worth stating because this entry currently rates at the top of the
directory, and part of why is a repository boundary rather than anything about
the software.
"""
